<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script nonce="{{ csp_nonce }}">
  // Тема до первой отрисовки: выбор пользователя или системная
  (function () {
    var t = null;
    try { t = localStorage.getItem("pulse-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<title>{% block title %}Пульс адаптации{% endblock %} · InsightForge</title>
{% set description = "Пульс адаптации — сервис для HR: показывает, где оценки стажёра и наставника расходятся, объясняет причину и подсказывает, что делать." %}
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ public_url }}{{ request.url.path }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="Пульс адаптации">
<meta property="og:title" content="{{ self.title() }} · Пульс адаптации">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ public_url }}{{ request.url.path }}">
<meta property="og:image" content="{{ public_url }}/static/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#05070F">
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script src="/static/js/core.js?v={{ asset_v }}"></script>
<script src="/static/js/orbs.js?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
